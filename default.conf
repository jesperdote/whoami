server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Support both /health and /health.txt
    location ~ ^/health(\.txt)?$ {
        root /usr/share/nginx/html;
        try_files /health.txt =404;
        default_type text/plain;
    }
}
